name: CI Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Typstyle
        run: |
          cargo install typstyle || (wget https://github.com/Enter-tainer/typstyle/releases/latest/download/typstyle-x86_64-unknown-linux-musl -O typstyle && chmod +x typstyle && sudo mv typstyle /usr/local/bin/)

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          # 如果檢查失敗，自動在 Log 中顯示差異，方便開發者修復
          extra_args: --all-files --show-diff-on-failure
