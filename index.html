<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangChain Agent 聊天室</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
      }
      #chat-container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      }
      #messages {
        height: 400px;
        overflow-y: auto;
        border: 1px solid #ddd;
        padding: 10px;
        margin-bottom: 15px;
        background: #fafafa;
        border-radius: 4px;
      }
      .message {
        margin-bottom: 10px;
        padding: 8px 12px;
        border-radius: 4px;
        max-width: 80%;
      }
      .user {
        background-color: #e0f7fa;
        margin-left: auto;
        text-align: right;
      }
      .agent {
        background-color: #f1f1f1;
        margin-right: auto;
      }
      #input-area {
        display: flex;
        gap: 10px;
      }
      #question {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:disabled {
        background-color: #ccc;
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <h2>LangChain Agent 互動介面</h2>
      <div id="messages"></div>
      <div id="input-area">
        <input
          type="text"
          id="question"
          placeholder="輸入您的問題..."
          onkeydown="if (event.key === 'Enter') sendMessage();"
        />
        <button id="send-btn" onclick="sendMessage()">發送</button>
      </div>
    </div>

    <script>
      const threadId = "web-session-" + Math.random().toString(36).substr(2, 9); // 隨機產生 thread_id 保持對話記憶

      async function sendMessage() {
        const inputEl = document.getElementById("question");
        const sendBtn = document.getElementById("send-btn");
        const messagesEl = document.getElementById("messages");
        const question = inputEl.value.trim();

        if (!question) return;

        appendMessage(question, "user");
        inputEl.value = "";
        inputEl.disabled = true;
        sendBtn.disabled = true;

        const agentMessageEl = appendMessage("", "agent");

        try {
          const response = await fetch(
            `/api/chat?question=${encodeURIComponent(question)}&thread_id=${threadId}`,
          );

          if (!response.ok) throw new Error("網路連線異常");

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            agentMessageEl.innerText += chunk;

            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch (error) {
          agentMessageEl.innerText = "出錯了: " + error.message;
        } finally {
          inputEl.disabled = false;
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      function appendMessage(text, sender) {
        const messagesEl = document.getElementById("messages");
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message", sender);
        msgDiv.innerText = text;
        messagesEl.appendChild(msgDiv);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return msgDiv;
      }
    </script>
  </body>
</html>
