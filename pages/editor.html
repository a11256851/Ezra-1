<!doctype html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知識庫筆記編輯器</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-sidebar: #f7f7f7;
      --bg-hover: #e8e8e8;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --border-color: #e0e0e0;
      --primary-color: #1a73e8;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "Fira Code", "Consolas", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 側邊欄設計 (類似 Obsidian) */
    #sidebar {
      width: 250px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .icon-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }

    .icon-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    #file-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .file-item {
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-item:hover {
      background-color: var(--bg-hover);
    }

    .file-item.active {
      background-color: #e6f0fa;
      color: var(--primary-color);
      font-weight: 500;
    }

    /* 主編輯區設計 (類似 HackMD) */
    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-main);
    }

    .editor-header {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-input {
      font-size: 1.25rem;
      font-weight: 600;
      border: none;
      outline: none;
      width: 50%;
      color: var(--text-main);
      background: transparent;
    }

    .title-input::placeholder {
      color: #bdc3c7;
    }

    .action-btns {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: transparent;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background-color: #1557b0;
    }

    /* 雙欄工作區 */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .pane {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* 編輯器端 */
    #editor-pane {
      border-right: 1px solid var(--border-color);
      background-color: #fafafa;
    }

    #markdown-input {
      width: 100%;
      height: 100%;
      border: none;
      resize: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      line-height: 1.6;
      color: #333;
      background: transparent;
    }

    /* 預覽端 */
    #preview-pane {
      background-color: var(--bg-main);
      line-height: 1.6;
    }

    /* 基礎 Markdown 樣式渲染 */
    #preview-pane h1,
    #preview-pane h2,
    #preview-pane h3 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      font-weight: 600;
    }

    #preview-pane p {
      margin-bottom: 1em;
    }

    #preview-pane code {
      background-color: #f1f3f4;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.85em;
    }

    #preview-pane pre {
      background-color: #f1f3f4;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 1em;
    }

    #preview-pane pre code {
      background-color: transparent;
      padding: 0;
    }

    #preview-pane blockquote {
      border-left: 4px solid var(--border-color);
      padding-left: 16px;
      color: var(--text-muted);
      margin: 1em 0;
    }
  </style>
</head>

<body>

  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>知識庫文件</h2>
      <button class="icon-btn" onclick="createNewNote()" title="新增筆記">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
    <div id="file-list">
    </div>
  </aside>

  <main id="main-container">
    <header class="editor-header">
      <input type="text" id="note-title" class="title-input" placeholder="無標題筆記" oninput="updateTitle()" />
      <div class="action-btns">
        <button class="btn" onclick="togglePreview()">切換預覽</button>
        <button class="btn btn-primary" onclick="saveNote()">儲存至資料庫</button>
      </div>
    </header>

    <div class="workspace">
      <div class="pane" id="editor-pane">
        <textarea id="markdown-input" placeholder="在此輸入 Markdown 內容..." oninput="updatePreview()"></textarea>
      </div>
      <div class="pane" id="preview-pane">
      </div>
    </div>
  </main>

  <script>
    // 模擬初始狀態與資料
    let currentNoteId = 1;
    let notes = {
      1: {title: "系統架構草案", content: "# 系統架構\n\n這是一份測試文件，支援 **Markdown** 語法。\n\n## 功能列表\n- 知識庫檢索\n- 即時筆記編輯\n\n> 引用：這段文字稍後將存入資料庫中。"},
      2: {title: "會議紀錄", content: "# 2026-06-11 會議紀錄\n\n今日討論了關於整合 LangChain Agent 的前端介面..."}
    };

    const titleInput = document.getElementById("note-title");
    const editorInput = document.getElementById("markdown-input");
    const previewPane = document.getElementById("preview-pane");
    const editorPane = document.getElementById("editor-pane");
    const fileList = document.getElementById("file-list");

    // 初始化
    function init() {
      renderFileList();
      loadNote(currentNoteId);
    }

    // 渲染左側檔案列表
    function renderFileList() {
      fileList.innerHTML = "";
      Object.keys(notes).forEach(id => {
        const div = document.createElement("div");
        div.className = `file-item ${id == currentNoteId ? "active" : ""}`;
        div.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            ${notes[id].title || "無標題筆記"}
          `;
        div.onclick = () => loadNote(id);
        fileList.appendChild(div);
      });
    }

    // 載入指定筆記
    function loadNote(id) {
      currentNoteId = id;
      titleInput.value = notes[id].title;
      editorInput.value = notes[id].content;
      updatePreview();
      renderFileList();
    }

    // 新增筆記
    function createNewNote() {
      const newId = Date.now();
      notes[newId] = {title: "", content: ""};
      currentNoteId = newId;
      loadNote(newId);
    }

    // 當輸入框標題改變時
    function updateTitle() {
      if (notes[currentNoteId]) {
        notes[currentNoteId].title = titleInput.value;
        renderFileList();
      }
    }

    // 即時更新 Markdown 預覽
    function updatePreview() {
      const content = editorInput.value;
      if (notes[currentNoteId]) {
        notes[currentNoteId].content = content;
      }
      // 使用 marked.js 轉換語法
      previewPane.innerHTML = marked.parse(content);
    }

    // 模擬儲存動作
    function saveNote() {
      const payload = {
        id: currentNoteId,
        title: titleInput.value,
        content: editorInput.value
      };

      console.log("準備發送至後端 API 的資料：", payload);
      alert(`「${payload.title || "無標題筆記"}」已觸發儲存邏輯。\n（此處日後可串接 fetch 發送 POST 請求至 /api/store）`);
    }

    // 控制雙欄顯示或單欄切換
    let isPreviewSplit = true;
    function togglePreview() {
      isPreviewSplit = !isPreviewSplit;
      if (isPreviewSplit) {
        editorPane.style.display = "block";
        previewPane.style.display = "block";
      } else {
        // 單獨顯示預覽
        editorPane.style.display = "none";
        previewPane.style.display = "block";
      }
    }

    // 執行初始化
    init();
  </script>
</body>

</html>
